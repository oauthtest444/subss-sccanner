name: Continuous Recon Scanner

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours leaves ~15 minutes after the 5h45m scan window.
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: continuous-recon-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 345 # 5 hours 45 minutes
    env:
      PYTHONUNBUFFERED: "1"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Python packages
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run checkpointed scanner
        shell: bash
        run: |
          set -Eeuo pipefail

          ROOT="$PWD"
          DATA="$ROOT/data"
          TOOLS="$ROOT/tools"
          DOMAINS="$DATA/all-domains.txt"
          STATE="$DATA/.scan-state.json"
          START_EPOCH="$(date +%s)"
          # Keep a small margin below the hard 345-minute GitHub job limit.
          DEADLINE="$((START_EPOCH + 342 * 60))"

          mkdir -p "$DATA"

          python - "$DOMAINS" "$STATE" <<'PY'
          import json, pathlib, sys
          domains = pathlib.Path(sys.argv[1])
          state = pathlib.Path(sys.argv[2])
          if not state.exists():
              state.write_text(json.dumps({
                  "domain_index": 0,
                  "subdomain_index": 0,
                  "stage": "enumerate",
                  "domain": "",
                  "subdomain": "",
              }, indent=2) + "\n")
          PY

          save_state() {
            local domain="$1"
            local subdomain="$2"
            local stage="$3"
            local di="$4"
            local si="$5"
            python - "$STATE" "$domain" "$subdomain" "$stage" "$di" "$si" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          p.write_text(json.dumps({
              "domain": sys.argv[2],
              "subdomain": sys.argv[3],
              "stage": sys.argv[4],
              "domain_index": int(sys.argv[5]),
              "subdomain_index": int(sys.argv[6]),
          }, indent=2) + "\n")
          PY
          }

          # Remove a fully-scanned domain from all-domains.txt (preserves order of remaining lines).
          remove_domain_from_list() {
            local domain="$1"
            python - "$DOMAINS" "$domain" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          target = sys.argv[2].strip().lower()
          if not path.exists():
              sys.exit(0)
          lines = path.read_text().splitlines()
          new_lines = []
          for line in lines:
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  new_lines.append(line)
                  continue
              if stripped.lower() != target:
                  new_lines.append(line)
          path.write_text("\n".join(new_lines) + ("\n" if new_lines else ""))
          PY
          }

          git_commit_state() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            if ! git diff --cached --quiet; then
              git commit -m "scanner: checkpoint $1" || true
              git push || true
            fi
          }

          now() { date +%s; }
          time_left() { echo $((DEADLINE - $(now))); }

          # Return 0 only if enough time remains for another stage.
          have_time() {
            local need="${1:-120}"
            [[ "$(time_left)" -gt "$need" ]]
          }

          # Load domains preserving file order (first occurrence only, no sort).
          mapfile -t DOMAINS_LIST < <(
            awk '
              /^[[:space:]]*(#|$)/ { next }
              {
                gsub(/[[:space:]]/, "", $0)
                if ($0 == "") next
                key = tolower($0)
                if (!(key in seen)) {
                  seen[key] = 1
                  print $0
                }
              }
            ' "$DOMAINS"
          )

          # Load checkpoint.
          readarray -t ST < <(python - "$STATE" <<'PY'
          import json, pathlib, sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text())
          for k in ("domain","subdomain","stage","domain_index","subdomain_index"):
              print(s.get(k, "" if k in ("domain","subdomain","stage") else 0))
          PY
          )
          CURRENT_DOMAIN="${ST[0]}"
          CURRENT_SUB="${ST[1]}"
          CURRENT_STAGE="${ST[2]}"
          DOMAIN_INDEX="${ST[3]:-0}"
          SUB_INDEX="${ST[4]:-0}"

          # Always start from the first domain in the *current* list.
          # Resume stage/subdomain only when the first domain matches the saved domain.
          # This way, if you reorder / prepend a new domain, the next run
          # picks the new first domain (from enumerate) instead of the old one.
          if (( ${#DOMAINS_LIST[@]} > 0 )); then
            FIRST="${DOMAINS_LIST[0]}"
            if [[ "$CURRENT_DOMAIN" == "$FIRST" && "$CURRENT_STAGE" != "done-domain" && "$CURRENT_STAGE" != "idle" ]]; then
              DOMAIN_INDEX=0
              # keep CURRENT_STAGE / CURRENT_SUB / SUB_INDEX as loaded
            else
              DOMAIN_INDEX=0
              SUB_INDEX=0
              CURRENT_DOMAIN="$FIRST"
              CURRENT_SUB=""
              CURRENT_STAGE="enumerate"
              save_state "$FIRST" "" "enumerate" 0 0
            fi
          else
            DOMAIN_INDEX=0
            SUB_INDEX=0
            CURRENT_DOMAIN=""
            CURRENT_SUB=""
            CURRENT_STAGE="idle"
          fi

          # Clear any leftover "done-domain" so we do not skip the first entry.
          if [[ "$CURRENT_STAGE" == "done-domain" ]]; then
            CURRENT_STAGE="enumerate"
            CURRENT_DOMAIN=""
            CURRENT_SUB=""
            SUB_INDEX=0
          fi

          while have_time 180; do
            # Reload list each iteration so removals take effect immediately.
            mapfile -t DOMAINS_LIST < <(
              awk '
                /^[[:space:]]*(#|$)/ { next }
                {
                  gsub(/[[:space:]]/, "", $0)
                  if ($0 == "") next
                  key = tolower($0)
                  if (!(key in seen)) {
                    seen[key] = 1
                    print $0
                  }
                }
              ' "$DOMAINS"
            )

            if (( ${#DOMAINS_LIST[@]} == 0 )); then
              echo "[+] All configured domains have been processed (list empty)."
              save_state "" "" "idle" 0 0
              git_commit_state "idle"
              exit 0
            fi

            # Always work on the first remaining domain.
            DOMAIN_INDEX=0
            DOMAIN="${DOMAINS_LIST[$DOMAIN_INDEX]}"
            DOMAIN_DIR="$DATA/$DOMAIN"
            VALID_FILE="$DOMAIN_DIR/valid-subdomains.txt"
            mkdir -p "$DOMAIN_DIR"

            # A domain begins at enumeration, unless a checkpoint says otherwise
            # *and* it is still the first domain in the list.
            if [[ "$CURRENT_DOMAIN" != "$DOMAIN" ]]; then
              CURRENT_DOMAIN="$DOMAIN"
              CURRENT_SUB=""
              CURRENT_STAGE="enumerate"
              SUB_INDEX=0
              save_state "$DOMAIN" "" "enumerate" "$DOMAIN_INDEX" 0
              git_commit_state "$DOMAIN-enumerate"
            fi

            if [[ "$CURRENT_STAGE" == "enumerate" ]]; then
              if ! have_time 180; then break; fi
              echo "[*] [$DOMAIN] Running subdomain enumeration..."
              rm -f "$VALID_FILE"
              python3 "$TOOLS/subdomain_enum.py" "$DOMAIN" -o "$VALID_FILE" || true
              echo "[+] [$DOMAIN] subdomain_enum finished"
              mapfile -t SUBS < <(grep -Ev '^[[:space:]]*(#|$)' "$VALID_FILE" | sort -fu)
              SUB_INDEX=0
              if ((${#SUBS[@]} == 0)); then
                # No valid subs — treat domain as fully done and remove it.
                echo "[*] [$DOMAIN] No valid subdomains — removing from all-domains.txt"
                remove_domain_from_list "$DOMAIN"
                save_state "" "" "done-domain" 0 0
                git_commit_state "$DOMAIN-no-valid-subs"
                CURRENT_DOMAIN=""
                CURRENT_SUB=""
                CURRENT_STAGE="enumerate"
                SUB_INDEX=0
                continue
              fi
              CURRENT_STAGE="subdomain"
              save_state "$DOMAIN" "${SUBS[0]}" "subdomain" "$DOMAIN_INDEX" 0
              git_commit_state "$DOMAIN-enumeration-complete"
            fi

            mapfile -t SUBS < <(grep -Ev '^[[:space:]]*(#|$)' "$VALID_FILE" | sort -fu)

            while (( SUB_INDEX < ${#SUBS[@]} )); do
              if ! have_time 180; then
                save_state "$DOMAIN" "${SUBS[$SUB_INDEX]}" "$CURRENT_STAGE" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-timeout"
                exit 0
              fi

              SUB="${SUBS[$SUB_INDEX]}"
              SUB_DIR="$DOMAIN_DIR/$SUB"
              mkdir -p "$SUB_DIR"

              # Stage files are written directly into the subdomain directory.
              # Temporary/intermediate files stay outside it and are removed.
              WORK="$DATA/.work/$DOMAIN/$SUB"
              mkdir -p "$WORK"

              # Normalize a new/current subdomain checkpoint.
              if [[ "$CURRENT_SUB" != "$SUB" ]]; then
                CURRENT_SUB="$SUB"
                CURRENT_STAGE="bootstrap"
                save_state "$DOMAIN" "$SUB" "$CURRENT_STAGE" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-$SUB-start"
              elif [[ "$CURRENT_STAGE" == "subdomain" ]]; then
                CURRENT_STAGE="bootstrap"
                save_state "$DOMAIN" "$SUB" "$CURRENT_STAGE" "$DOMAIN_INDEX" "$SUB_INDEX"
              fi

              if [[ "$CURRENT_STAGE" == "bootstrap" ]]; then
                echo "[*] [$DOMAIN/$SUB] Running bootstrap_url..."
                rm -f "$WORK/bootstrap-url.txt"
                if url="$(python3 "$TOOLS/bootstrap_url.py" "$SUB" -r 4 -t 15)"; then
                  printf '%s\n' "$url" > "$WORK/bootstrap-url.txt"
                  save_state "$DOMAIN" "$SUB" "archive" "$DOMAIN_INDEX" "$SUB_INDEX"
                else
                  : > "$WORK/bootstrap-url.txt"
                  save_state "$DOMAIN" "$SUB" "archive" "$DOMAIN_INDEX" "$SUB_INDEX"
                fi
                echo "[+] [$DOMAIN/$SUB] bootstrap_url finished"
                git_commit_state "$DOMAIN-$SUB-bootstrap"
              fi

              if [[ "$CURRENT_STAGE" == "archive" ]]; then
                echo "[*] [$DOMAIN/$SUB] Fetching archive URLs..."
                rm -f "$WORK/urls.txt" "$WORK/archive-q-urls.txt"
                TARGET="https://$SUB/"
                wget -qO "$WORK/urls.txt" "https://web.archive.org/cdx/search/cdx?url=${TARGET}&matchType=domain&fl=original&collapse=urlkey&output=text&filter=statuscode:200" || true

                fgrep '?' "$WORK/urls.txt" |
                  egrep -i -v '\.(js|gif|jpg|jpeg|png|css|gz|svg|ico|webp|avif|bmp|txt|pdf|xml|json|map|mp4|webm|ogv|mov|mp3|wav|ogg|flac|aac|m4a|woff|woff2|ttf|otf|eot|zip|rar|7z|tar)(\?|$)' \
                  > "$WORK/archive-q-urls.txt" || true

                # q-urls.txt = bootstrap 200/HTML URL + archive query URLs.
                cat "$WORK/bootstrap-url.txt" "$WORK/archive-q-urls.txt" 2>/dev/null |
                  awk 'NF && !seen[$0]++' > "$WORK/q-urls.txt" || true

                echo "[+] [$DOMAIN/$SUB] archive stage finished"
                save_state "$DOMAIN" "$SUB" "route-recon" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-$SUB-archive"
              fi

              if [[ "$CURRENT_STAGE" == "route-recon" ]]; then
                echo "[*] [$DOMAIN/$SUB] Running route_params_recon..."
                rm -f "$SUB_DIR/all-uniq-routs.txt" "$SUB_DIR/all-uniq-params.txt"
                rm -rf "$WORK/route-tmp"
                mkdir -p "$WORK/route-tmp"
                # route_params_recon creates its own .route_params_recon_tmp
                # in the current working directory.
                (
                  cd "$WORK/route-tmp"
                  python3 "$TOOLS/route_params_recon.py" \
                    -f "$WORK/q-urls.txt" \
                    -ro "$SUB_DIR/all-uniq-routs.txt" \
                    -po "$SUB_DIR/all-uniq-params.txt" || true
                )
                rm -rf "$WORK/route-tmp"
                echo "[+] [$DOMAIN/$SUB] route_params_recon finished"
                save_state "$DOMAIN" "$SUB" "xss" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-$SUB-route-recon"
              fi

              if [[ "$CURRENT_STAGE" == "xss" ]]; then
                echo "[*] [$DOMAIN/$SUB] Running xss_reflect_checker..."
                rm -f "$SUB_DIR/xss-vulnerable.txt"
                python3 "$TOOLS/xss_reflect_checker.py" \
                  -l "$SUB_DIR/all-uniq-routs.txt" \
                  -p "$SUB_DIR/all-uniq-params.txt" \
                  -o "$SUB_DIR/xss-vulnerable.txt" || true
                # xss-vulnerable.txt is intentionally not retained in the
                # requested final six-file set, but is kept for scanner use.
                rm -f "$SUB_DIR/xss-vulnerable.txt"
                echo "[+] [$DOMAIN/$SUB] xss_reflect_checker finished"
                save_state "$DOMAIN" "$SUB" "listener" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-$SUB-xss"
              fi

              if [[ "$CURRENT_STAGE" == "listener" ]]; then
                echo "[*] [$DOMAIN/$SUB] Running unique_listener_scanner..."
                rm -rf "$WORK/listener" "$SUB_DIR/unique_listener_scanner"
                python3 "$TOOLS/unique_listener_scanner.py" \
                  -l "$SUB_DIR/all-uniq-routs.txt" \
                  -o "$WORK/listener" || true
                # Only keep listener result files that have actual content.
                for lf in no-validation-listener.txt p-xss-listener.txt validation-listener.txt; do
                  src="$WORK/listener/$lf"
                  if [[ -s "$src" ]]; then
                    cp "$src" "$SUB_DIR/"
                  else
                    rm -f "$SUB_DIR/$lf"
                  fi
                done
                rm -rf "$WORK/listener"
                echo "[+] [$DOMAIN/$SUB] unique_listener_scanner finished"
                save_state "$DOMAIN" "$SUB" "complete-subdomain" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-$SUB-listener"
              fi

              if [[ "$CURRENT_STAGE" == "complete-subdomain" ]]; then
                # Keep only files that have actual content; remove blank/empty ones.
                for f in all-uniq-routs.txt all-uniq-params.txt no-validation-listener.txt p-xss-listener.txt validation-listener.txt; do
                  if [[ -e "$SUB_DIR/$f" ]] && [[ ! -s "$SUB_DIR/$f" ]]; then
                    rm -f "$SUB_DIR/$f"
                  fi
                done
                rm -rf "$WORK"
                SUB_INDEX=$((SUB_INDEX + 1))
                CURRENT_SUB=""
                CURRENT_STAGE="subdomain"
                save_state "$DOMAIN" "" "subdomain" "$DOMAIN_INDEX" "$SUB_INDEX"
                git_commit_state "$DOMAIN-$SUB-complete"
              fi

              # Refresh stage from state after each stage transition.
              readarray -t ST < <(python - "$STATE" <<'PY'
          import json, pathlib, sys
          s=json.loads(pathlib.Path(sys.argv[1]).read_text())
          for k in ("domain","subdomain","stage","domain_index","subdomain_index"):
              print(s.get(k, "" if k in ("domain","subdomain","stage") else 0))
          PY
              )
              CURRENT_DOMAIN="${ST[0]}"
              CURRENT_SUB="${ST[1]}"
              CURRENT_STAGE="${ST[2]}"
              DOMAIN_INDEX="${ST[3]:-0}"
              SUB_INDEX="${ST[4]:-0}"

              # If the current stage is still complete-subdomain, the next loop
              # iteration finalizes it. Otherwise continue the checkpointed stage.
            done

            # All subdomains for this domain are done — remove domain from list.
            echo "[*] [$DOMAIN] All subdomains finished — removing from all-domains.txt"
            remove_domain_from_list "$DOMAIN"
            CURRENT_DOMAIN=""
            CURRENT_SUB=""
            CURRENT_STAGE="enumerate"
            SUB_INDEX=0
            DOMAIN_INDEX=0
            save_state "" "" "done-domain" 0 0
            git_commit_state "$DOMAIN-complete"
          done

          echo "[+] Scan window ended; next scheduled/manual run resumes from data/.scan-state.json."
